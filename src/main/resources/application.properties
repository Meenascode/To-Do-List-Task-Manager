spring.application.name=todo-list-task-manager
server.port=8080

# ---- Embedded H2 database, file mode (relative to the folder where the app is started) ----
# The file ./data/tododb.mv.db is created automatically on first start and kept between restarts.
spring.datasource.url=jdbc:h2:file:./data/tododb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# schema.sql only uses CREATE ... IF NOT EXISTS, so existing data is always preserved.
spring.sql.init.mode=always

# ---- Sessions ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when the app is served over HTTPS
server.servlet.session.cookie.secure=false

# ---- Never leak internals in error responses ----
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---- Static files: always revalidate so edits show up immediately ----
spring.web.resources.cache.cachecontrol.no-cache=true

# ---- Application settings ----
# All "today", "overdue" and timestamp calculations use this timezone.
app.timezone=Asia/Kolkata
# Optional demo account (disabled by default). See README.
app.demo.enabled=false
app.demo.password=

logging.level.root=INFO
